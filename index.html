
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 maximum-scale=1, user-scalable=no">
  <title>mahjong-lite</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: #000;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"
            width="960"
            height="600"
            tabindex="-1">
    </canvas>
  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/Live.loader.js";

    const config = {
      dataUrl: buildUrl + "/Live.data.unityweb",
      frameworkUrl: buildUrl + "/Live.framework.js.unityweb",
      codeUrl: buildUrl + "/Live.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "mahjong-lite",
      productVersion: "1.0"
    };

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        // Optional: update a loading indicator here.
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
      }).catch((message) => {
        console.error(message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
